<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<base href="{{ '/' | absolute_url }}">

	{% if page.ios_app_id %}
		<title class="pageTitle">{{ page.app_name | default: page.title }}</title>
		<meta name="description" content="{{ page.app_description }}">
		<link rel="shortcut icon" href="{{ page.app_icon | default: site.app_icon | relative_url }}">
		{% if site.enable_smart_app_banner %}
			<meta name="apple-itunes-app" content="app-id={{ page.ios_app_id }}">
		{% endif %}
	{% else %}
		<title class="pageTitle">{{ site.page_title }}</title>
		<meta name="description" content="{{ site.site_description }}">
		<link rel="shortcut icon" href="{{ site.app_icon | relative_url }}">
	{% endif %}

	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
	<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">
</head>
